version: '3.6'

services:
  keycloak_web:
    image: custom-keycloak
    container_name: keycloak_web
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloakdb:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password

      KC_HOSTNAME: 127.0.0.1
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_SPI_THEME_STATIC_MAX_AGE: -1
      KEYCLOAK_SPI_THEME_CACHE_THEMES: "false"
      KEYCLOAK_SPI_THEME_CACHE_TEMPLATES: "false"
      # TEST is realm name
      TEST_KAFKA_TOPIC: keycloak
      TEST_KAFKA_CLIENT_ID: keycloak
      TEST_KAFKA_BOOTSTRAP_SERVERS: 127.0.0.1:9092
      TEST_KAFKA_EVENTS: LOGIN
    command: start-dev
    depends_on:
      - keycloakdb
    ports:
      - 8080:8080

  keycloakdb:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password

volumes:
  postgres_data: